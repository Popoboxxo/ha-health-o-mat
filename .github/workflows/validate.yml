name: Validate HACS & Hassfest

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Version pinned to keep CI deterministic and in sync with the
      # locally used ruff (see pyproject.toml for the rule configuration).
      - name: Ruff lint
        run: uvx ruff@0.16.3 check .
      - name: Ruff format check
        run: uvx ruff@0.16.3 format --check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13 && uv venv .venv && uv pip install --python .venv/bin/python -r tests/requirements.txt
      - run: .venv/bin/python -m pytest tests/ -q
