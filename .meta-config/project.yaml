project:
  name: ha-health-o-mat
  prefix: hom
  short: health-o-mat
agent-meta-version: 2.0.0-beta.5
orchestrator:
  mode: advisory
auto_commit:
  mode: auto
  triggers:
  - task-boundary
ai-providers:
- Claude
- Gemini
- Opencode
dod-preset: rapid-prototyping
platforms:
- hacs
roles:
- agent-meta-manager
- bug-feature-analyzer
- code-reviewer
- concept-reviewer
- developer
- devops-engineer
- documenter
- git
- ideation
- junior-developer
- meta-feedback
- orchestrator
- principal-developer
- release
- requirements
- senior-developer
- tester
- validator
variables:
  PROJECT_NAME: ha-health-o-mat
  PROJECT_DESCRIPTION: Home Assistant HACS Custom Integration für Getränke-Tracking,
    Blutdruck-Messwerte und Wohlbefinden-Erfassung pro Person — ein Config-Entry pro
    Person, dynamisch beliebig oft anlegbar.
  PROJECT_GOAL: Eine schlanke, robuste HACS-Integration (custom_components/health_o_mat)
    bereitstellen, die tägliche Trink-/Gesundheitswerte erfasst, als native HA-Entities
    zur Verfügung stellt — unter konsequenter Beachtung der aus vorherigen HACS-Integrationen
    gelernten Lektionen (Releases, unique_id-Stabilität, Setup-Architektur, Config/Options-Flow).
  PROJECT_STRUCTURE: |-
    custom_components/health_o_mat/   # Integration (HA-frei: logic.py, parser.py)
    tests/                            # Unit-Tests ohne HA-Paket (Fake-Package in conftest.py)
    tests_e2e/                        # E2E-Tests gegen die HA-Testinstanz
    scripts/                          # E2E-/Bootstrap-Hilfsskripte
    docs/                             # Konzepte, Pläne, Requirement-Traceability
    .meta-config/project.yaml         # deklarative Projekt-Konfiguration (agent-meta)
  ENTRY_POINT_PATTERN: custom_components/health_o_mat/__init__.py — async_setup_entry/async_unload_entry, Services, Entry-Registry unter hass.data[DOMAIN][entry_id]
  KEY_PATTERNS: |-
    - Ein Config-Entry = eine Person (kein Singleton, dynamisch beliebig viele Entries; Duplikat-Schutz über async_set_unique_id + _abort_if_unique_id_configured)
    - Gemeinsamer Store unter hass.data[DOMAIN]["shared"]["store"]; Runtime-/Coordinator-Daten pro Entry unter hass.data[DOMAIN][entry_id]
    - Ein DataUpdateCoordinator pro Config-Entry mit update_interval=None; Refresh via async_set_updated_data() bei Events statt Polling
    - Heute-Fenster und Summen on-read berechnen — kein Reset-Job (neustart- und DST-fest)
    - unique_id = f"{entry_id}_{key}" stabil + device_info ab Entity #1; has_entity_name + translation_key, keine Namens-Literale
    - Plattform-Name == Dateiname (sensor.py, binary_sensor.py, button.py, number.py, select.py, text.py)
    - Options-Flow für nachträglich Korrigierbares; strukturelle Daten explizit in entry.data
  PLATFORM: Home Assistant (HACS Custom Integration)
  RUNTIME: Home Assistant Core
  PROJECT_LANGUAGES: Python
  LANGUAGE: Python
  COMMUNICATION_LANGUAGE: Deutsch
  USER_INPUT_LANGUAGE: Deutsch
  DOCS_LANGUAGE: Englisch
  INTERNAL_DOCS_LANGUAGE: Deutsch
  CODE_LANGUAGE: Englisch
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/Popoboxxo/ha-health-o-mat
  GIT_MAIN_BRANCH: main
  BUILD_COMMAND: ''
  TEST_COMMAND: pytest
  DEV_COMMANDS: |-
    python3 -m pytest -q
    python3 -m compileall -q custom_components/health_o_mat
    # HA-Konfiguration prüfen (Dev-Instanz): /home/hermes/ha-test/bin/ha core check
  DEV_STACK_RELOAD: |-
    /home/hermes/ha-test/bin/sync <repo-dir>
    /home/hermes/ha-test/bin/ha GET /api/states
  TEST_COMMANDS: |-
    pytest tests/
    # E2E gegen geteilte HA-Testinstanz (Etikette: /home/hermes/ha-test/README.md)
    /home/hermes/ha-test/bin/sync <repo-dir>
    /home/hermes/ha-test/bin/ha GET /api/states
    /home/hermes/ha-test/bin/check-dashboards <repo-dir>/examples/*.yaml
  BUILD_COMMANDS: ''
  PROJECT_CONTEXT: |-
    HACS-Integration im Standard-Layout custom_components/health_o_mat/. Ein Config-Entry = eine Person (dynamisch beliebig oft anlegbar, kein Hardcoding). Persistenz über ein gemeinsames homeassistant.helpers.storage.Store-Objekt unter hass.data[DOMAIN]["shared"]["store"]; Runtime-/Coordinator-Daten pro Entry getrennt unter hass.data[DOMAIN][entry_id] (Entry-Registry, damit Services ihre Person wiederfinden). Ein DataUpdateCoordinator pro Config-Entry (update_interval=None, Refresh via async_set_updated_data() bei Event statt Polling). Plattformen: sensor, binary_sensor, button, number, select, text. Options-/Config-Flow: eine Person pro Entry, Duplikat-Schutz via async_set_unique_id + _abort_if_unique_id_configured, Update-Listener via entry.add_update_listener.
    Geteilte HA-Testinstanz (repo-agnostisch, mehrere Plugin-Repos): /home/hermes/ha-test
    — Headless Home Assistant (Docker), http://127.0.0.1:8123 (nur localhost), Token:
    /home/hermes/ha-test/.ha-state/token.json (auto-refresh). Single Source of Truth
    (Endpunkte, Config-Flows, Storage-Details): /home/hermes/ha-test/README.md.
    Etikette: (1) bin/sync <repo-dir> kopiert custom_components/* und startet HA neu
    (~10–30 s) — nur die eigene Domain syncen, dazu koordinieren; Registry/Config-
    Entries anderer Domains überleben den Neustart. (2) bin/reset löscht ALLE Daten
    aller Plugins (danach bin/provision + Re-Sync) — nur nach Abstimmung. (3)
    unique_ids stabil halten, NIE ändern — die geteilte Registry akkumuliert. (4)
    bin/set-language de|en betrifft die GANZE Instanz (friendly_names aller Plugins)
    — nur koordiniert; Erst-Registrierung der Entities mit korrekter Systemsprache
    (obj_id-Namen entstehen nur dabei aus dem englischen Anzeigenamen). (5) Tokens
    (.ha-state/) niemals committen oder kopieren.
  ARCHITECTURE: |-
    custom_components/health_o_mat/
      __init__.py         # Setup/Unload, Services, Options-Handling, Entry-Registry
      const.py            # Domain/Keys/Konstanten
      store.py            # HealthOMatStore (Storage-Persistenz je Person)
      logic.py            # reine Logik (Tagesfenster on-read, Summen), HA-frei
      parser.py           # Freitext-Parser für Getränke-Eingaben
      statistics.py       # Aggregation/Auswertungen (HA-frei wo möglich)
      reminders.py        # Erinnerungs-Logik
      entity.py           # gemeinsame HealthOMatEntity-Basis (unique_id, device_info)
      sensor.py, binary_sensor.py, button.py, number.py, select.py, text.py
      config_flow.py      # Config-/Options-Flow (Duplikat-Schutz, Update-Listener)
      services.yaml       # Service-Definitionen (voluptuous-Schema in __init__.py)
      exporter.py         # CSV-Export-Service (privater Ordner, nie /config/www)
      importer.py, backup.py, restore.py   # Import/Backup/Restore
      diagnostics.py      # Diagnostics (keine Secrets/Gesundheitsdaten)
      ui_store.py         # Store für UI-/Panel-Präferenzen
      panel.py, frontend.py, ws_api.py     # Web-Panel, Frontend-Ressourcen, WS-API
      areas.py            # Area-Zuordnung pro Person
      strings.json, translations/{de,en}.json  # Master (en) + Übersetzungen
      www/health-o-mat-*.js                # Lovelace-Card + Panels (E2E-getestet)
    tests/                 # isolierte Unit-Tests (importlib, ohne HA-Paket)
    tests_e2e/             # E2E gegen geteilte HA-Testinstanz
    scripts/               # E2E-/Bootstrap-Hilfsskripte
    docs/                  # Konzepte, Pläne, REQUIREMENTS.md, E2E-Belege
  CODE_CONVENTIONS: |-
    - `from __future__ import annotations` + vollständige Type-Hints
    - unique_id + device_info ab Entity #1; unique_id stabil & entry-spezifisch ({entry_id}_{key}), NIE nachträglich ändern
    - Store liegt unter hass.data[DOMAIN]["shared"]["store"]; Runtime-Daten pro Entry unter hass.data[DOMAIN][entry_id]
    - Domain snake_case ohne Bindestriche (health_o_mat)
    - iot_class nur in manifest.json, nie in hacs.json
    - Plattform-Name == Dateiname (z.B. "select" in PLATFORMS braucht select.py) — sonst ModuleNotFoundError beim Setup
    - has_entity_name = True + translation_key statt hartkodierter Entity-Namen
    - state_class setzen (measurement/total) wo sinnvoll, für Langzeitstatistik
    - Zeitstempel-Entities mit device_class: timestamp
    - Nachträglich Korrigierbares gehört in Options, nicht ins initiale Setup
    - Config-Flow muss strukturelle Daten explizit in entry.data schreiben, nicht nur als Default annehmen
    - Services mit voluptuous-Schema + ServiceValidationError, danach Refresh via async_set_updated_data()
    - Zeitfenster ("heute") on-read berechnen statt Reset-Job — neustart- und DST-fest
  EXTRA_DONTS: |-
    - Git-Tag ohne echtes GitHub-Release reicht NICHT für HACS-Updates — immer `gh release create vX.Y.Z`
    - VERSION im ConfigFlow NIE ohne async_migrate_entry() erhöhen (sonst "Migration handler not found", Entry lädt nicht mehr)
    - unique_id NIE nachträglich ändern (verwaiste Entities, User muss manuell am Gerät aufräumen)
    - iot_class NIE in hacs.json — ausschließlich ins manifest.json
    - Keine Versions-Downgrades ohne Schutz zulassen (if version > CURRENT: abort)
    - Kein Fachjargon ("Store", "Entry", "Coordinator") im User-facing Config-/Options-Flow-Text
    - Sensible Exporte NIE nach /config/www (öffentliches Media-Panel) — nur in private Ordner wie /config/health_o_mat_export/
    - Config-/Options-Flow-Validierung NIE blockierend bei Netzfehlern abbrechen lassen — nur eindeutige Fehler (z.B. 401) brechen ab, sonst "Prüfung überspringen"-Option anbieten
    - Keine Telemetrie und keine undokumentierten Cloud-Calls
    - Keine Geheimnisse/Gesundheitsdaten in Diagnostics — nur Counts, Versionen, maskierte Werte
  CODE_QUALITY_RULES: |-
    - CI ab Tag 1: hacs/action + home-assistant/actions/hassfest in .github/workflows/validate.yml
    - Release-Dreiklang: Commit + Tag (vX.Y.Z) + echtes GitHub Release, Tag exakt synchron zu manifest.version
    - Erst Unit-Tests der HA-freien Logik (Fake-Package/importlib wie in tests/), dann E2E auf Dev-Instanz, erst danach Release
    - translations/strings.json als Master, de/en synchron halten
    - Debugging-Reihenfolge bei "geht nicht": 1) Entity-Generation prüfen (Device-Seite, nicht nur Entitätsliste) 2) HA-Log auf ModuleNotFoundError (Plattform-Datei fehlt) oder "Migration handler not found" (VERSION ohne Migrator) 3) HACS zeigt kein Update? Release vs. Tag + Tag↔manifest-Sync prüfen 4) Setup bricht sofort komplett ab? Syntax/Import-Fehler in EINER Plattform-Datei killt alle 5) Services finden nichts? hass.data-Registry-Befüllung prüfen
  REQ_CATEGORIES: |-
    - **Kernfunktionalität** — Kernfeatures des Projekts
    - **Lifecycle** — Startup, Shutdown, Fehlerbehandlung
    - **Nichtfunktionale Anforderungen** — Performance, Sicherheit, Wartbarkeit
  TESTER_SNIPPETS_PATH: ''
  DEVELOPER_SNIPPETS_PATH: ''
  AGENT_META_REPO: Popoboxxo/agent-meta
rules-preset: default
speech-mode: full
tier-preset: Normal
se-focus: false
model-inherit-main-chat:
  Claude: true
  Gemini: true
  Opencode: true
max-parallel-agents: 2
conventions-preset: default
debug-mode: false
allow-committed-secrets: false
gitignore:
  generated: true
  settings: true
  ignore-provider-dirs: true
  custom_entries:
  - .meta-config/platform-defaults.resolved.yaml
  - opencode.json
# Repo-Containment ('Gefängnis-Modus'): confines agent WRITE access to the project root (plus the tmp-sink). Opt-out: enabled: false.
repo_containment:
  enabled: true
  tmp-sink:
    enabled: true
    path: .tmp
    gitignore: true
    cleanup: manual
