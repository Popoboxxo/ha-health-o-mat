add_drink:
  name: Getränk buchen
  description: Bucht eine Getränkemenge für eine Person.
  fields:
    person:
      name: Person
      description: Name der Person (leer = einzige konfigurierte Person).
      example: "Caro"
    amount_ml:
      name: Menge (ml)
      description: Getränkemenge in Millilitern.
      example: 250
    drink_type:
      name: Getränk
      description: Bezeichnung des Getränks (optional, Default „Eigen").
      example: "Kaffee"
    source:
      name: Quelle
      description: Freier Herkunfts-Tag (optional).
      example: "automation"
    ts:
      name: Zeitpunkt
      description: >-
        Zeitpunkt der Erfassung als ISO 8601 (z. B. 2026-10-24T18:30 oder mit
        Offset). Leer = jetzt. Höchstens 5 Minuten in der Zukunft, nicht vor 1900.
      example: "2026-10-24T18:30:00+02:00"

add_blood_pressure:
  name: Blutdruckmessung speichern
  description: Speichert systolischen/diastolischen Wert und optional Puls.
  fields:
    person:
      name: Person
      description: Name der Person (leer = einzige konfigurierte Person).
      example: "Caro"
    systolic:
      name: Systolisch
      description: Oberwert in mmHg.
      example: 124
    diastolic:
      name: Diastolisch
      description: Unterwert in mmHg.
      example: 82
    pulse:
      name: Puls
      description: Herzfrequenz in BPM (optional).
      example: 64
    note:
      name: Notiz
      description: Freitext-Notiz zur Messung (optional).
      example: "morgens"
    ts:
      name: Zeitpunkt
      description: >-
        Zeitpunkt der Erfassung als ISO 8601 (z. B. 2026-10-24T18:30 oder mit
        Offset). Leer = jetzt. Höchstens 5 Minuten in der Zukunft, nicht vor 1900.
      example: "2026-10-24T18:30:00+02:00"

set_wellbeing:
  name: Wohlbefinden melden
  description: Meldet das aktuelle Wohlbefinden einer Person per Schlüssel oder Zahl (1–10).
  fields:
    person:
      name: Person
      description: Name der Person (leer = einzige konfigurierte Person).
      example: "Caro"
    status:
      name: Zustand
      description: >-
        Wohlbefinden-Schlüssel — very_bad, awful, bad, poor, okay, mixed, good,
        very_good, great oder excellent. Alternative zu `score`.
      example: "good"
    score:
      name: Zahl
      description: >-
        Numerischer Wert von 1 (sehr schlecht) bis 10 (ausgezeichnet).
        Alternative zu `status`.
      example: 7
    ts:
      name: Zeitpunkt
      description: >-
        Zeitpunkt der Erfassung als ISO 8601 (z. B. 2026-10-24T18:30 oder mit
        Offset). Leer = jetzt. Höchstens 5 Minuten in der Zukunft, nicht vor 1900.
      example: "2026-10-24T18:30:00+02:00"

remove_last_entry:
  name: Letzte Buchung löschen
  description: >-
    Entfernt die letzte aktive Getränke-, Blutdruck- oder
    Wohlbefinden-Buchung (Undo). Der Eintrag wird als gelöscht markiert und
    bleibt im Verlauf wiederherstellbar.
  fields:
    person:
      name: Person
      description: Name der Person (leer = einzige konfigurierte Person).
    kind:
      name: Art
      description: >-
        Welche Buchung entfernt wird — Getränk (Standard), Blutdruckmessung
        oder Wohlbefinden-Meldung.
      example: "drinks"
      selector:
        select:
          options:
            - label: Getränk
              value: "drinks"
            - label: Blutdruckmessung
              value: "blood_pressure"
            - label: Wohlbefinden-Meldung
              value: "wellbeing"

void_entry:
  name: Eintrag löschen
  description: >-
    Markiert einen einzelnen Eintrag als gelöscht (kein endgültiges Löschen).
    Die ID stammt aus dem Eintrags-Verlauf; der Eintrag bleibt
    wiederherstellbar.
  fields:
    person:
      name: Person
      description: Name der Person (leer = einzige konfigurierte Person).
    kind:
      name: Art
      description: Art des Eintrags.
      example: "drinks"
      selector:
        select:
          options:
            - label: Getränk
              value: "drinks"
            - label: Blutdruckmessung
              value: "blood_pressure"
            - label: Wohlbefinden-Meldung
              value: "wellbeing"
    id:
      name: Eintrags-ID
      description: ID des Eintrags (aus dem Verlauf).
      example: "3f2b8c1e-0a4d-4f5e-9a76-1b2c3d4e5f60"
      required: true

restore_entry:
  name: Eintrag wiederherstellen
  description: Hebt die Löschmarkierung eines Eintrags wieder auf.
  fields:
    person:
      name: Person
      description: Name der Person (leer = einzige konfigurierte Person).
    kind:
      name: Art
      description: Art des Eintrags.
      example: "drinks"
      selector:
        select:
          options:
            - label: Getränk
              value: "drinks"
            - label: Blutdruckmessung
              value: "blood_pressure"
            - label: Wohlbefinden-Meldung
              value: "wellbeing"
    id:
      name: Eintrags-ID
      description: ID des gelöschten Eintrags (aus dem Verlauf).
      example: "3f2b8c1e-0a4d-4f5e-9a76-1b2c3d4e5f60"
      required: true

export_csv:
  name: CSV-Export
  description: >-
    Exportiert die Daten als Excel-taugliche CSV nach /config/health_o_mat_export/.
    Nur für Administratoren.
  fields:
    person:
      name: Person
      description: Name der Person (leer = alle Personen).
    dataset:
      name: Datensatz
      description: Welche Daten exportiert werden.
      example: "all"
      selector:
        select:
          options:
            - label: Alles
              value: "all"
            - label: Getränke
              value: "drinks"
            - label: Blutdruck
              value: "blood_pressure"

import_csv:
  name: CSV-Import
  description: >-
    Importiert Getränke- oder Blutdruckdaten aus /config/health_o_mat_import/
    (nur dieses Verzeichnis, niemals /config/www).
  fields:
    filename:
      name: Dateiname
      description: Dateiname innerhalb des Import-Ordners /config/health_o_mat_import/.
      example: "health_o_mat_drinks_Max_20261014-1200.csv"
      required: true
    person:
      name: Person
      description: Ziel-Person (leer = einzige konfigurierte Person).
      example: "Caro"
    dataset:
      name: Datensatz
      description: Welche Daten importiert werden (all = automatisch erkennen).
      example: "all"
      selector:
        select:
          options:
            - label: Alles (automatisch)
              value: "all"
            - label: Getränke
              value: "drinks"
            - label: Blutdruck
              value: "blood_pressure"

backup:
  name: Backup
  description: >-
    Sichert alle Personen und Datensätze als JSON nach /config/health_o_mat_export/.
    Nur für Administratoren.

restore_backup:
  name: Backup wiederherstellen
  description: >-
    Spielt ein JSON-Backup aus /config/health_o_mat_import/ oder
    /config/health_o_mat_export/ kontrolliert zurück
    (Merge oder Replace, optional nur bestimmte Personen/Datensätze/Zeiträume).
    Vor jedem echten Restore wird ein Sicherheitsbackup im Export-Ordner
    angelegt. Nur für Administratoren.
  fields:
    filename:
      name: Dateiname
      description: >-
        Dateiname in /config/health_o_mat_import/ oder
        /config/health_o_mat_export/.
      example: "health_o_mat_backup_20261014-120000.json"
      required: true
    mode:
      name: Modus
      description: >-
        Merge ergänzt Einträge (Duplikate werden übersprungen); Replace leert
        zuerst den gewählten Bereich und benötigt die Bestätigung REPLACE.
      default: "merge"
      selector:
        select:
          options:
            - label: Zusammenführen
              value: "merge"
            - label: Ersetzen
              value: "replace"
    persons:
      name: Personen
      description: >-
        Nur diese Personen wiederherstellen (Quell-Slug, Quell-Entry-ID oder
        Ziel-Entry-ID; leer = alle).
    datasets:
      name: Datensätze
      description: Nur diese Datensätze wiederherstellen (leer = alle).
      selector:
        select:
          multiple: true
          options:
            - label: Getränke
              value: "drinks"
            - label: Blutdruck
              value: "blood_pressure"
            - label: Wohlbefinden
              value: "wellbeing"
    from:
      name: Von (ISO)
      description: Nur Einträge ab diesem Zeitstempel (inklusive).
      example: "2026-01-01T00:00:00"
    to:
      name: Bis (ISO)
      description: Nur Einträge bis zu diesem Zeitstempel (inklusive).
      example: "2026-12-31T23:59:59"
    person_map:
      name: Personen-Zuordnung
      description: >-
        Zuordnung von Quelle zu Ziel-Entry-ID. Nötig, wenn die Person im Ziel
        nicht über den Namen eindeutig gefunden wird. Personen werden nie
        automatisch angelegt.
    dry_run:
      name: Probelauf
      description: Nur planen, nichts schreiben.
      default: false
      selector:
        boolean:
    confirm:
      name: Bestätigung
      description: Bei Modus "replace" ist exakt "REPLACE" erforderlich.
      example: "REPLACE"
    restore_audit:
      name: Audit-Log importieren
      description: >-
        Audit-Log aus dem Backup zusätzlich übernehmen (nur für Experten;
        standardmäßig werden nur neue Restore-Ereignisse geschrieben).
      default: false
      selector:
        boolean:

weekly_report:
  name: Wochenbericht senden
  description: >-
    Sendet die letzten sieben Tage je Person als Markdown-Benachrichtigung
    (kein Datei-Export). Leerer Benachrichtigungsdienst erzeugt einen Hinweis
    in Home Assistant.
  fields:
    person:
      name: Person
      description: >-
        Name der Person (leer = jede eingerichtete Person erhält einen eigenen
        Bericht).
      example: "Caro"

add_lab_value:
  name: Laborwert erfassen
  description: Speichert einen Laborwert (Katalog- oder eigener Marker) für eine Person.
  fields:
    person:
      name: Person
      description: Name der Person (leer = einzige konfigurierte Person).
      example: "Caro"
    marker:
      name: Marker
      description: >-
        Stabiler Marker-Schlüssel (z. B. alt, creatinine, crp) oder ein eigener
        Marker-Key aus dem Admin-Panel. Deutsche Laborsynonyme (gpt, got,
        gamma_gt) werden automatisch aufgelöst.
      example: "alt"
      selector:
        select:
          custom_value: true
          options:
            - label: ALT (GPT)
              value: "alt"
            - label: AST (GOT)
              value: "ast"
            - label: GGT (Gamma-GT)
              value: "ggt"
            - label: Bilirubin gesamt
              value: "bilirubin_total"
            - label: Gesamteiweiß
              value: "total_protein"
            - label: Kreatinin
              value: "creatinine"
            - label: eGFR
              value: "egfr"
            - label: Harnstoff
              value: "urea"
            - label: Protein/Kreatinin-Quotient (Urin)
              value: "urine_protein_creatinine_ratio"
            - label: Natrium
              value: "sodium"
            - label: Kalium
              value: "potassium"
            - label: Calcium gesamt
              value: "calcium"
            - label: Magnesium
              value: "magnesium"
            - label: Chlorid
              value: "chloride"
            - label: Gesamtcholesterin
              value: "cholesterol_total"
            - label: LDL
              value: "ldl"
            - label: HDL
              value: "hdl"
            - label: Triglyceride
              value: "triglycerides"
            - label: TSH
              value: "tsh"
            - label: fT4
              value: "ft4"
            - label: fT3
              value: "ft3"
            - label: Hämoglobin
              value: "hemoglobin"
            - label: Leukozyten
              value: "leukocytes"
            - label: Thrombozyten
              value: "platelets"
            - label: CRP
              value: "crp"
            - label: BSG
              value: "esr"
            - label: Lipase
              value: "lipase"
            - label: Amylase
              value: "amylase"
            - label: Tacrolimus (Talspiegel)
              value: "tacrolimus"
    value:
      name: Wert
      description: Messwert in der angegebenen (oder Standard-)Einheit.
      example: 32.0
      required: true
    unit:
      name: Einheit
      description: >-
        Einheit des Werts (optional, Default = kanonische Einheit des
        Markers). Für Marker mit Verwechslungsgefahr (z. B. das
        Protein/Kreatinin-Quotient) ist dieses Feld Pflicht.
      example: "U/L"
    ts:
      name: Zeitpunkt
      description: >-
        Zeitpunkt der Erfassung als ISO 8601 (z. B. 2026-10-24T18:30 oder mit
        Offset). Leer = jetzt. Höchstens 5 Minuten in der Zukunft, nicht vor 1900.
      example: "2026-10-24T18:30:00+02:00"
    report_ref:
      name: Berichts-Referenz
      description: >-
        Optionaler Link oder externe ID des Laborberichts (max. 500 Zeichen).
        Nur Referenz, Health-O-Mat ruft die URL nie selbst auf.
      example: "https://example.com/laborbericht/123"

remove_last_lab_value:
  name: Letzten Laborwert löschen
  description: >-
    Entfernt den letzten aktiven Laborwert eines bestimmten Markers (Undo).
    Der Eintrag wird als gelöscht markiert und bleibt wiederherstellbar.
  fields:
    person:
      name: Person
      description: Name der Person (leer = einzige konfigurierte Person).
    marker:
      name: Marker
      description: Stabiler Marker-Schlüssel, dessen letzter Wert entfernt wird.
      example: "alt"
      required: true
