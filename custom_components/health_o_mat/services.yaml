add_drink:
  name: Getränk buchen
  description: Bucht eine Getränkemenge für eine Person.
  fields:
    person:
      name: Person
      description: Name der Person (leer = einzige konfigurierte Person).
      example: "Caro"
    amount_ml:
      name: Menge (ml)
      description: Getränkemenge in Millilitern.
      example: 250
    drink_type:
      name: Getränk
      description: Bezeichnung des Getränks (optional, Default „Eigen").
      example: "Kaffee"
    source:
      name: Quelle
      description: Freier Herkunfts-Tag (optional).
      example: "automation"

add_blood_pressure:
  name: Blutdruckmessung speichern
  description: Speichert systolischen/diastolischen Wert und optional Puls.
  fields:
    person:
      name: Person
      description: Name der Person (leer = einzige konfigurierte Person).
      example: "Caro"
    systolic:
      name: Systolisch
      description: Oberwert in mmHg.
      example: 124
    diastolic:
      name: Diastolisch
      description: Unterwert in mmHg.
      example: 82
    pulse:
      name: Puls
      description: Herzfrequenz in BPM (optional).
      example: 64
    note:
      name: Notiz
      description: Freitext-Notiz zur Messung (optional).
      example: "morgens"

set_wellbeing:
  name: Wohlbefinden melden
  description: Meldet das aktuelle Wohlbefinden einer Person per Schlüssel oder Zahl (1–10).
  fields:
    person:
      name: Person
      description: Name der Person (leer = einzige konfigurierte Person).
      example: "Caro"
    status:
      name: Zustand
      description: >-
        Wohlbefinden-Schlüssel — very_bad, awful, bad, poor, okay, mixed, good,
        very_good, great oder excellent. Alternative zu `score`.
      example: "good"
    score:
      name: Zahl
      description: >-
        Numerischer Wert von 1 (sehr schlecht) bis 10 (ausgezeichnet).
        Alternative zu `status`.
      example: 7

remove_last_entry:
  name: Letzte Buchung löschen
  description: >-
    Entfernt die letzte aktive Getränke-, Blutdruck- oder
    Wohlbefinden-Buchung (Undo). Der Eintrag wird als gelöscht markiert und
    bleibt im Verlauf wiederherstellbar.
  fields:
    person:
      name: Person
      description: Name der Person (leer = einzige konfigurierte Person).
    kind:
      name: Art
      description: >-
        Welche Buchung entfernt wird — Getränk (Standard), Blutdruckmessung
        oder Wohlbefinden-Meldung.
      example: "drinks"
      selector:
        select:
          options:
            - label: Getränk
              value: "drinks"
            - label: Blutdruckmessung
              value: "blood_pressure"
            - label: Wohlbefinden-Meldung
              value: "wellbeing"

void_entry:
  name: Eintrag löschen
  description: >-
    Markiert einen einzelnen Eintrag als gelöscht (kein endgültiges Löschen).
    Die ID stammt aus dem Eintrags-Verlauf; der Eintrag bleibt
    wiederherstellbar.
  fields:
    person:
      name: Person
      description: Name der Person (leer = einzige konfigurierte Person).
    kind:
      name: Art
      description: Art des Eintrags.
      example: "drinks"
      selector:
        select:
          options:
            - label: Getränk
              value: "drinks"
            - label: Blutdruckmessung
              value: "blood_pressure"
            - label: Wohlbefinden-Meldung
              value: "wellbeing"
    id:
      name: Eintrags-ID
      description: ID des Eintrags (aus dem Verlauf).
      example: "3f2b8c1e-0a4d-4f5e-9a76-1b2c3d4e5f60"
      required: true

restore_entry:
  name: Eintrag wiederherstellen
  description: Hebt die Löschmarkierung eines Eintrags wieder auf.
  fields:
    person:
      name: Person
      description: Name der Person (leer = einzige konfigurierte Person).
    kind:
      name: Art
      description: Art des Eintrags.
      example: "drinks"
      selector:
        select:
          options:
            - label: Getränk
              value: "drinks"
            - label: Blutdruckmessung
              value: "blood_pressure"
            - label: Wohlbefinden-Meldung
              value: "wellbeing"
    id:
      name: Eintrags-ID
      description: ID des gelöschten Eintrags (aus dem Verlauf).
      example: "3f2b8c1e-0a4d-4f5e-9a76-1b2c3d4e5f60"
      required: true

export_csv:
  name: CSV-Export
  description: Exportiert die Daten als Excel-taugliche CSV nach /config/health_o_mat_export/.
  fields:
    person:
      name: Person
      description: Name der Person (leer = alle Personen).
    dataset:
      name: Datensatz
      description: Welche Daten exportiert werden.
      example: "all"
      selector:
        select:
          options:
            - label: Alles
              value: "all"
            - label: Getränke
              value: "drinks"
            - label: Blutdruck
              value: "blood_pressure"

import_csv:
  name: CSV-Import
  description: >-
    Importiert Getränke- oder Blutdruckdaten aus /config/health_o_mat_import/
    (nur dieses Verzeichnis, niemals /config/www).
  fields:
    filename:
      name: Dateiname
      description: Dateiname innerhalb des Import-Ordners /config/health_o_mat_import/.
      example: "health_o_mat_drinks_Max_20261014-1200.csv"
      required: true
    person:
      name: Person
      description: Ziel-Person (leer = einzige konfigurierte Person).
      example: "Caro"
    dataset:
      name: Datensatz
      description: Welche Daten importiert werden (all = automatisch erkennen).
      example: "all"
      selector:
        select:
          options:
            - label: Alles (automatisch)
              value: "all"
            - label: Getränke
              value: "drinks"
            - label: Blutdruck
              value: "blood_pressure"

backup:
  name: Backup
  description: >-
    Sichert alle Personen und Datensätze als JSON nach /config/health_o_mat_export/.
