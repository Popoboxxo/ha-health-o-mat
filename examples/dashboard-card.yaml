# HA Health-O-Mat — Beispiel-Dashboard für die mitgelieferte Karte
#
# Zeigt dieselbe `custom:health-o-mat-card` in drei Konfigurationen:
#   1. Kompakt  — alle Defaults (Anzeige + alle Eingaben)
#   2. Anzeige  — reine Anzeige, keine Eingaben/Aktionen
#   3. Erfassen — eigene Getränkeauswahl + eigene Mengen + Eingaben
#
# Ohne `entry_id` zeigt die Karte automatisch eine Personenauswahl.
# Für ein festes Dashboard im Karten-Editor eine Person wählen (setzt
# `entry_id`) oder `entry_id: <config-entry-id>` ergänzen.
#
# Import: Einstellungen → Dashboards → Dashboard hinzufügen →
#         „Neues Dashboard aus YAML".
#
# Alle Optionen: siehe README-Abschnitt „Karten-Konfiguration".
title: Health-O-Mat (Karte)
views:
  # ---------------------------------------------------------------- Kompakt --
  - title: Kompakt
    path: kompakt
    icon: mdi:heart-pulse
    cards:
      - type: custom:health-o-mat-card
        # Alle Defaults: Anzeige-Blöcke + Getränke, manuelle Mengen,
        # Blutdruck- und Wohlbefinden-Eingabe, Undo.

  # ---------------------------------------------------------------- Anzeige --
  - title: Anzeige
    path: anzeige
    icon: mdi:eye-outline
    cards:
      - type: custom:health-o-mat-card
        show_person: false
        show_drinks: false
        show_manual_amounts: false
        show_blood_pressure_input: false
        show_wellbeing_input: false
        show_undo: false

  # --------------------------------------------------------------- Erfassen --
  - title: Erfassen
    path: erfassen
    icon: mdi:plus-circle-outline
    cards:
      - type: custom:health-o-mat-card
        # Auswahl aus den in der Integration konfigurierten Quick-Drinks.
        # `slot_0` … `slot_3` sind die Options-Slots; bei den Standard-Getränken
        # heißen die Keys z. B. `glas_wasser`, `kaffee`.
        drinks: ["slot_0", "slot_1"]
        # Eigene ml-Presets + freies Zahlenfeld:
        manual_amounts: [200, 330, 500]
        allow_custom_amount: true
        show_blood_pressure_input: true
        show_wellbeing_input: true
