[pytest]
# pytest configuration for ha-health-o-mat
# Windows-compatible, no fcntl-dependent plugins (pytest-homeassistant-custom-component)

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimal markers (no auto-discovery of pytest-homeassistant-custom-component)
markers =
    unit: unit test
    integration: integration test
    e2e: end-to-end smoke test

# Disable plugin autoload to avoid fcntl-dependent plugins on Windows
# (voluptuous and other non-HA dependencies are explicit in tests/requirements.txt)
addopts = -p no:homeassistant -p no:pytest_homeassistant_custom_component
