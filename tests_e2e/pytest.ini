[pytest]
# E2E suite configuration — deliberately separate from the repo-root
# pytest.ini (which describes the fast, HA-free unit tests and pins
# `testpaths = tests`).
#
# Consequences, both intended:
#   * `pytest` / `pytest -q` in the repo root still collects ONLY tests/ —
#     this file is never consulted for that run, because the root config
#     claims the run and `testpaths` excludes tests_e2e/.
#   * `pytest tests_e2e/` picks THIS file up (rootdir = tests_e2e), so the
#     browser suite has its own marker registry and can import the shared
#     bootstrap helper from scripts/ (`pythonpath` is resolved relative to
#     this rootdir, so `..` = the repository root).
pythonpath = ..

# Same two plugin blocks as the repo-root pytest.ini (which cannot be inherited
# here, see above): the `pytest-homeassistant-custom-component` plugin comes
# with an HA test environment, hijacks pytest-socket (the browser suite needs
# real network sockets) and expects HA fixtures this suite does not use.
addopts = -p no:homeassistant -p no:pytest_homeassistant_custom_component

markers =
    e2e: end-to-end test against a real Home Assistant instance in a real browser
